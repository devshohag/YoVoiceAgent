name: Appointment SQL tests

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appointment-sql:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Task25_TestOnly_StrongPassword_123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Task25_TestOnly_StrongPassword_123! -C -Q 'SELECT 1' -b"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
          --health-start-period=20s
    env:
      CCAAS_TASK25_SQL: "Server=localhost,1433;User ID=sa;Password=Task25_TestOnly_StrongPassword_123!;TrustServerCertificate=true;Encrypt=true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore CCaaS.sln
      - run: dotnet build CCaaS.sln -c Release --no-restore --warnaserror
      - run: dotnet test tests/CCaaS.Tests.Unit/CCaaS.Tests.Unit.csproj -c Release --no-build --filter "FullyQualifiedName~CCaaS.Tests.Unit.Appointment" --logger "trx;LogFileName=appointment-sql.trx"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appointment-sql-results
          path: "**/TestResults/**"
