name: Build release images

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  images:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: src/CCaaS.Api/Dockerfile
          - name: telephony-worker
            context: .
            dockerfile: src/CCaaS.Workers.Telephony/Dockerfile
          - name: web
            context: frontend
            dockerfile: frontend/Dockerfile.server
          - name: asterisk
            context: infra/asterisk
            dockerfile: infra/asterisk/Dockerfile
          - name: local-ai
            context: infra/local-ai
            dockerfile: infra/local-ai/Dockerfile
          - name: migrator
            context: .
            dockerfile: infra/migrator/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Normalize image path
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true
