name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: dotnet restore CCaaS.sln
      - run: dotnet build CCaaS.sln -c Release --no-restore --warnaserror
      - run: dotnet build tools/CCaaS.VoiceSimulator/CCaaS.VoiceSimulator.csproj -c Release --warnaserror
      - run: dotnet test CCaaS.sln -c Release --no-build --logger "trx;LogFileName=tests.trx" --collect:"XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: "**/TestResults/**"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration production
      - run: npm test -- --watch=false

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.server.example .env.server
      - run: sed -i 's/CHANGE_ME_32_CHARS/ValidPassword_12345678901234567890!/g; s/CHANGE_ME_24_CHARS/ValidSip_123456789012345!/g; s#CHANGE_ME_BASE64_OR_64_RANDOM_CHARS#abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ab#' .env.server
      - run: docker compose --env-file .env.server -f docker-compose.server.yml config -q
      - run: CCAAS_IMAGE_PREFIX=ghcr.io/example/ccaas CCAAS_VERSION=v0.0.0 docker compose --env-file .env.server -f docker-compose.server.yml -f docker-compose.release.yml config -q
      - run: bash -n scripts/server/*.sh
