# Section 5 reference architecture: "Nginx / API Gateway / Webhook Endpoints." Local/dev
# reverse proxy only - no TLS termination configured here yet (Section 14 Transport
# requirement: add real certs + `listen 443 ssl` before anything public-facing).
events {}

http {
    upstream ccaas_api {
        server ccaas-api:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ccaas_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
