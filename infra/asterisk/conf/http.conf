; Section 5/8: "ARI is the primary application call-control interface." ARI rides on
; Asterisk's built-in HTTP server, so it has to be enabled here first.
[general]
enabled=yes
bindaddr=0.0.0.0
bindport=8088
; WSS (secure WebSocket) for browser WebRTC signaling would need tlsenable=yes + certs -
; left disabled here for local dev (plain WS on 8088); enable + mount real certs before
; any real deployment (Section 14 - Transport: "TLS/HTTPS/WSS; secure SIP/WebRTC configuration").
tlsenable=no
