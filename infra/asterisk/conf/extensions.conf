; Section 8 - Voice & Telephony Architecture. Two contexts, deliberately kept simple:
;
;   [internal]   - plain Dial() between 1001/1002 so you can verify the whole WebRTC/PJSIP/
;                  Docker stack works (Milestone M2: "Extensions 1001 and 1002 register and
;                  call; browser phone can answer/hang up") WITHOUT depending on the
;                  Telephony worker's ARI app being finished yet.
;   7000          - routes into Stasis(ccaas), which hands the call to
;                  CCaaS.Workers.Telephony (AriEventListener) for application-controlled
;                  call handling (IVR/queue/routing - Milestone M3). Build your ARI answer/
;                  bridge logic against this extension as you implement Section 8's inbound
;                  flow, then move 1001/1002 over to Stasis once that logic exists.
;   from-trunk   - where a real inbound DID from your licensed SIP/IPTSP provider lands
;                  (Section 8 inbound call flow steps 8-14) - routed straight into Stasis so
;                  the application always owns real customer-facing call routing.

[internal]
exten => 1001,1,Dial(PJSIP/1001,20)
 same => n,Hangup()

exten => 1002,1,Dial(PJSIP/1002,20)
 same => n,Hangup()

exten => 7000,1,NoOp(CCaaS AI development call)
 same => n,Set(VOLUME(TX)=4)
 same => n,Set(VOLUME(RX)=3)
 same => n,Wait(1)
 same => n,Set(CCAAS_FULL_RECORDING=ccaas-full-${UNIQUEID})
 same => n,MixMonitor(/var/spool/asterisk/recording/${CCAAS_FULL_RECORDING}.wav)
 same => n,Stasis(ccaas)
 same => n,StopMixMonitor()
 same => n,Hangup()

; Phase 2 development handoff. The customer channel leaves ARI after the AI hold
; message, rings the human softphone on the requested extension, and returns to
; Stasis only after Dial finishes so the original call can be closed and audited.
[human-handoff]
exten => _X.,1,NoOp(CCaaS same-call human handoff to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Set(CCAAS_DIAL_STATUS=${DIALSTATUS})
 same => n,Set(CCAAS_HANGUP_CAUSE=${HANGUPCAUSE})
 same => n,StopMixMonitor()
 same => n,Stasis(ccaas,handoff-complete,${CCAAS_DIAL_STATUS},${CCAAS_HANGUP_CAUSE})
 same => n,Hangup()

[from-trunk]
exten => _X.,1,NoOp(Inbound PSTN call via licensed SIP/IPTSP trunk)
 same => n,Set(CCAAS_FULL_RECORDING=ccaas-full-${UNIQUEID})
 same => n,MixMonitor(/var/spool/asterisk/recording/${CCAAS_FULL_RECORDING}.wav)
 same => n,Stasis(ccaas)
 same => n,StopMixMonitor()
 same => n,Hangup()
