; Section 8 - Voice & Telephony Architecture. Matches Milestone M2 ("Extensions 1001 and 1002
; register and call; browser phone can answer/hang up; .NET receives call events") from the
; proposal's 12-month roadmap.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

;
; Local MicroSIP/Zoiper extension 1001. These are ordinary SIP/RTP endpoints, not WebRTC.
;
[1001]
type=aor
max_contacts=1

[1001]
type=auth
auth_type=userpass
username=1001
password=ccaas_demo_1001

[1001]
type=endpoint
context=internal
disallow=all
allow=ulaw
direct_media=no
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
auth=1001
aors=1001

;
; Demo extension 1002
;
[1002]
type=aor
max_contacts=1

[1002]
type=auth
auth_type=userpass
username=1002
password=ccaas_demo_1002

[1002]
type=endpoint
context=internal
disallow=all
allow=ulaw
direct_media=no
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
auth=1002
aors=1002

;
; Second development caller used to prove that one AI-agent profile can process
; two isolated calls concurrently. It is not a human queue agent.
;
[1003]
type=aor
max_contacts=1

[1003]
type=auth
auth_type=userpass
username=1003
password=ccaas_demo_1003

[1003]
type=endpoint
context=internal
disallow=all
allow=ulaw
direct_media=no
rewrite_contact=yes
force_rport=yes
rtp_symmetric=yes
auth=1003
aors=1003

;
; "default" outbound trunk placeholder - CCaaS.Workers.Telephony/AriClient.cs originates
; outbound calls as PJSIP/<number>@default. This is NOT a real BTRC-licensed SIP/IPTSP
; provider - Section 8's "Regulatory/telecom boundary" box is explicit that this software
; should not itself carry PSTN/mobile traffic. Replace host/username/password with your
; tenant's actual licensed provider trunk before any real outbound call is attempted.
[default]
type=aor
contact=sip:REPLACE_WITH_YOUR_SIP_PROVIDER_HOST

[default]
type=identify
endpoint=default
match=REPLACE_WITH_YOUR_SIP_PROVIDER_HOST

[default]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw
aors=default
