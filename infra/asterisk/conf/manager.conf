; Section 5: "AMI is used for selected management/operational events." No AMI client is
; wired up in the starter code yet (ARI covers call control) - this just leaves the door
; open for one (e.g. for PJSIP registration-state events or system-level monitoring).
[general]
enabled=yes
port=5038
bindaddr=0.0.0.0

[ccaas]
secret=ccaas_dev_password
permit=0.0.0.0/0.0.0.0
read=system,call,log,verbose,agent,user,config
write=system,call,log,verbose,agent,user,config
