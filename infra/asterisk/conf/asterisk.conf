; Base Asterisk paths - this whole conf/ directory is bind-mounted straight over
; /etc/asterisk in the container (see docker-compose.yml), which REPLACES the package's
; default config directory wholesale. These paths mirror Debian's packaged defaults so
; Asterisk still finds its modules/spool/log directories correctly at boot.
[directories]
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; Run in foreground under Docker rather than daemonizing (matches Dockerfile CMD "-f").
runuser = asterisk
rungroup = asterisk
